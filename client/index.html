<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a test</title>
    <meta name="description" content="Book blood tests and health checkups. Sample at the lab or at your home." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Book a test or a doctor's appointment" />
    <meta property="og:description" content="Book blood tests and health checkups, or a doctor's appointment. Sample at the lab or at your home." />
    <meta property="og:image" content="/images/home-collection-ai.webp" />

    <!-- The homepage hero photo is the largest thing painted in the first
         second (the LCP candidate) — preloading it lets the browser start
         fetching it immediately, in parallel with the JS bundle, instead of
         waiting for React to render the <img> tag before even discovering it. -->
    <link rel="preload" as="image" href="/images/home-collection-ai.webp" />

    <!-- Poppins for headings, Lato for reading. Preconnect first so the fonts
         start downloading before the stylesheet is parsed, which matters on a
         phone on mobile data. Loaded non-blocking (media="print" trick) so a
         slow Google Fonts round trip never delays first paint of the page
         itself — the fallback system font shows immediately and swaps in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
